[project]
name = "recipe-scraper"
version = "0.1.0"
description = "Tiered recipe page fetcher + extractor service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "mistralai>=3.6",
    "crawl4ai>=0.4",
    "playwright>=1.45",
    "recipe-scrapers>=15.13.0",
    "patchright>=1.64.3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.uv]
# The scraper is run in place (uvicorn app.main:app), not installed as a
# package; uv sync should only install the dependencies above.
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
